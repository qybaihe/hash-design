name: Bug report
description: Something in the library, CLI, MCP server, Skill or docs does not work as documented.
title: 'bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. **Security problems:** please do not file them here — follow [SECURITY.md](https://github.com/qybaihe/hash-design/blob/main/SECURITY.md) instead.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Core library (roll / mapping / briefs)
        - CLI (hash-design)
        - MCP server (hash-design-mcp)
        - critique_page / critique
        - build_compare_page / compare
        - Skill (SKILL.md)
        - Mapping / font pool / palettes
        - Docs / README / examples
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: |
        Commands or MCP tool calls with their arguments. For mapping or brief problems, include the ref (`<hash>` or `<hash>+<probe>`), the constraints and the library fingerprint shown in the brief.
      placeholder: |
        node packages/core/dist/bin.js brief <64-hex hash>+<probe> --light-only
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Error messages, MCP client logs or critique output. This is rendered as a code block.
      render: shell
  - type: input
    id: version
    attributes:
      label: hash-design commit or version
      description: 'Output of `git rev-parse --short HEAD` in your checkout (the packages are not on npm yet).'
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and OS
      placeholder: 'Node 22.11, macOS 15'
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: MCP client (if relevant)
      options:
        - Not relevant
        - Claude Code
        - Cursor
        - Claude Desktop
        - Other
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I rebuilt (`npm run build`) after pulling the latest `main`.
