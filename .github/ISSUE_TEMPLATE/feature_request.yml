name: Feature request
description: Suggest an improvement to the library, CLI, MCP server, Skill or docs.
title: 'feat: '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Proposing a new design genre? Use the **New branch proposal** template instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Include the MCP tool / CLI flag / API you have in mind, if any.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: component
    attributes:
      label: Component
      multiple: true
      options:
        - Core library
        - CLI
        - MCP server
        - Critique rules
        - Compare page
        - Skill / agent workflow
        - Docs / translations
        - Other
  - type: checkboxes
    id: principles
    attributes:
      label: Project principles
      description: See [CONTRIBUTING.md](https://github.com/qybaihe/hash-design/blob/main/CONTRIBUTING.md#ground-rules).
      options:
        - label: This does not let the agent pick or "improve" the style instead of the dice.
          required: true
        - label: I would be willing to open a pull request for this.
