name: Release

# Publishes the npm package hash-design (packages/core: library, CLI, Skill) when a GitHub Release is
# published. packages/mcp (hash-design-mcp) stays in the monorepo but is private and never published.
# Nothing is published on pushes to main: a release needs a version bump, a CHANGELOG section and a
# published GitHub Release tagged v<version>. Running the workflow by hand is a dry run (verify + pack).
#
# Authentication is npm Trusted Publishing (OIDC): no npm token or secret. The package on npmjs.com
# trusts this workflow file (qybaihe/hash-design, release.yml). If this file is renamed, update the
# Trusted Publisher on hash-design. Setup and release steps: docs/publishing.md.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for npm Trusted Publishing; provenance is generated from it

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish hash-design to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No package-manager cache in the publishing job (npm's trusted publishing guidance).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1.
      - name: Use npm 11 (>= 11.5.1 for trusted publishing)
        run: |
          npm install -g npm@11
          node -e '
            const v = process.argv[1];
            const [a, b, c] = v.split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error("npm " + v + " is too old for trusted publishing (needs >= 11.5.1)");
              process.exit(1);
            }
            console.log("npm " + v);
          ' "$(npm --version)"

      - run: npm ci

      - name: Check version, tag, CHANGELOG and package manifests
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            node scripts/release-check.mjs --tag "$TAG"
          else
            node scripts/release-check.mjs
          fi

      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Smoke test (CLI + MCP over real stdio)
        run: node scripts/smoke.mjs

      - name: Pack the tarball that will be published
        run: |
          node scripts/release-check.mjs --pack
          mkdir -p release-assets
          npm pack -w hash-design --pack-destination release-assets
          ls -l release-assets

      # Trusted publishing: npm exchanges the GitHub OIDC token for a short-lived publish credential,
      # so no npm token or repository secret is involved.
      - name: Publish hash-design to npm
        if: github.event_name == 'release'
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/core/package.json').version")
          DIST_TAG=latest
          if [[ "$VERSION" == *-* || "$PRERELEASE" == "true" ]]; then DIST_TAG=next; fi
          if npm view "hash-design@${VERSION}" version >/dev/null 2>&1; then
            echo "hash-design@${VERSION} is already on npm; nothing to publish."
            exit 0
          fi
          npm publish "release-assets/hash-design-${VERSION}.tgz" --provenance --access public --tag "${DIST_TAG}"
          echo "Published hash-design@${VERSION} (dist-tag ${DIST_TAG}) with provenance."

      - name: Dry run summary
        if: github.event_name != 'release'
        run: echo "::notice::Dry run only. Publish a GitHub Release tagged v<version> to publish hash-design to npm."
